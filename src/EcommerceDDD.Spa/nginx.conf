server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles of the current build; if the browser caches it,
    # it keeps loading the previous build after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
