<div class="card fadeInDown login-container">
  <div class="card-body login-form">
    <h4>Forgot my password</h4>
    <hr />
    @if (sent) {
    <p>
      If this e-mail is registered, a link to choose a new password is on its way.
    </p>
    <div class="alert alert-info mb-0">
      This demo sends no real e-mails: open the
      <a [href]="mailpitUrl" target="_blank" rel="noopener">Mailpit inbox</a>
      to find the reset link.
    </div>
    } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <input
        class="form-control"
        type="email"
        formControlName="email"
        placeholder="E-mail"
      />
      <input
        type="submit"
        class="btn btn-primary login-button mt-3"
        value="Send reset link"
        [disabled]="form.invalid || loaderService.loading()"
      />
    </form>
    }
    <hr />
    <a [routerLink]="['/login']" class="create-account-link">Back to login</a>
  </div>
</div>
